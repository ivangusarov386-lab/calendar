<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь класса 9Ц</title>

<!-- PWA: манифест + иконки, чтобы сайт можно было добавить на экран
     телефона как отдельное приложение (см. README.md, раздел "PWA"). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1638">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="9Ц Календарь">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css?v=14">
<!-- Шрифты подключены неблокирующе (preload + swap), чтобы медленная загрузка
     Google Fonts не задерживала выполнение скриптов ниже по странице. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital@1&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital@1&display=swap"></noscript>
</head>
<body>
<div class="page">

  <header class="cal-header">
   <div class="hero-badge">
    <div class="hero-doodles" aria-hidden="true">
      <span class="doodle doodle--formula" style="top:0%; left:0%;">a² + b² = c²</span>
      <span class="doodle doodle--formula doodle--right" style="top:0%; right:0%;">x = (−b ± √(b²−4ac)) / 2a</span>

      <svg class="doodle doodle--svg doodle--axes" style="top:-4%; left:39%;" viewBox="0 0 100 100">
        <path d="M10 90 L92 90 M84 84 L92 90 L84 96" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 90 L10 8 M4 16 L10 8 L16 16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 88 Q40 84 70 18" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="4 4"/>
      </svg>

      <svg class="doodle doodle--svg doodle--triangle" style="bottom:-2%; left:2%;" viewBox="0 0 100 100">
        <path d="M18 88 L18 22 L86 88 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <rect x="18" y="79" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="4" y="58" font-size="11">b</text>
        <text x="48" y="98" font-size="11">a</text>
        <text x="58" y="50" font-size="11">c</text>
      </svg>

      <span class="doodle doodle--formula doodle--sqrt" style="bottom:10%; left:16%;">√x</span>
      <span class="doodle doodle--formula doodle--sigma" style="bottom:-6%; left:34%;">Σⁿᵢ₌₁</span>

      <svg class="doodle doodle--svg doodle--circle" style="bottom:-8%; right:16%;" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="currentColor" stroke-width="1.4"/>
        <line x1="50" y1="6" x2="50" y2="94" stroke="currentColor" stroke-width="1.4"/>
        <text x="86" y="46" font-size="10">x</text>
        <text x="55" y="15" font-size="10">y</text>
      </svg>

      <svg class="doodle doodle--svg doodle--cube" style="top:22%; right:-3%;" viewBox="0 0 100 100">
        <rect x="15" y="36" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="37" y="16" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="15" y1="36" x2="37" y2="16" stroke="currentColor" stroke-width="2"/>
        <line x1="63" y1="36" x2="85" y2="16" stroke="currentColor" stroke-width="2"/>
        <line x1="15" y1="84" x2="37" y2="64" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="63" y1="84" x2="85" y2="64" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>

    <div class="chrome-badge" aria-hidden="true">
      <span class="chrome-badge__depth">9ц</span>
      <span class="chrome-badge__face">9ц</span>
    </div>
    <p class="cal-eyebrow">Календарь класса</p>
    <p class="cal-subeyebrow">события · экскурсии · собрания</p>
   </div>

    <div class="view-switch" id="section-switch" role="tablist" aria-label="Раздел">
      <button type="button" id="section-events-btn" class="view-switch__btn is-active" role="tab" aria-selected="true" data-section="events">Мероприятия<span class="update-dot" id="events-update-dot" hidden></span></button>
      <button type="button" id="section-schedule-btn" class="view-switch__btn" role="tab" aria-selected="false" data-section="schedule">Расписание<span class="update-dot" id="schedule-update-dot" hidden></span></button>
    </div>

    <div class="cal-nav" id="cal-nav">
      <button id="cal-prev" class="nav-btn" aria-label="Предыдущий месяц">&#8592;</button>
      <h1 id="cal-title">Загрузка…</h1>
      <button id="cal-next" class="nav-btn" aria-label="Следующий месяц">&#8594;</button>
    </div>

    <div class="view-switch" id="events-view-switch" role="tablist" aria-label="Вид календаря">
      <button type="button" id="view-grid-btn" class="view-switch__btn" role="tab" aria-selected="true" data-view="grid">Сетка</button>
      <button type="button" id="view-list-btn" class="view-switch__btn" role="tab" aria-selected="false" data-view="list">Список</button>
    </div>

    <div class="cal-nav" id="schedule-nav" hidden>
      <button id="schedule-prev" class="nav-btn" aria-label="Предыдущий день">&#8592;</button>
      <h1 id="schedule-title">Понедельник</h1>
      <button id="schedule-next" class="nav-btn" aria-label="Следующий день">&#8594;</button>
    </div>
  </header>

  <div id="cal-banner" class="cal-banner" hidden></div>

  <div class="cal-panel" id="cal-panel">
    <div class="cal-weekdays" id="cal-weekdays"></div>
    <div id="cal-grid" class="cal-grid" role="grid" aria-busy="true"></div>
  </div>

  <div class="cal-panel cal-list" id="cal-list" hidden></div>

  <div id="cal-legend" class="cal-legend"></div>

  <div class="cal-panel schedule-panel" id="schedule-panel" hidden></div>

  <footer class="cal-footer">
    <span class="cal-footer__dot"></span>
    Данные обновляются напрямую из Google Таблицы при каждом открытии
  </footer>
</div>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-date">
    <button id="modal-close" class="modal-close" aria-label="Закрыть">&times;</button>
    <p id="modal-date" class="modal-date"></p>
    <div id="modal-events"></div>
  </div>
</div>

<script src="js/config.js?v=14"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
